name: Supabase to Notion Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_TABLE: ${{ secrets.SUPABASE_TABLE }}
          SUPABASE_SELECT: ${{ secrets.SUPABASE_SELECT }}
          SUPABASE_ID_COLUMN: ${{ secrets.SUPABASE_ID_COLUMN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_KEY_PROPERTY: ${{ secrets.NOTION_KEY_PROPERTY }}
          NOTION_KEY_PROPERTY_TYPE: ${{ secrets.NOTION_KEY_PROPERTY_TYPE }}
          NOTION_PAYLOAD_PROPERTY: ${{ secrets.NOTION_PAYLOAD_PROPERTY }}
        run: npm run sync:notion

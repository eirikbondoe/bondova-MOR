name: Notion Sync

on:
  schedule:
    # Run every 6 hours (adjust as needed)
    - cron: "0 */6 * * *"
  workflow_dispatch:
    # Allow manual trigger

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Notion sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SUPABASE_TABLE_EXAMPLE: ${{ secrets.SUPABASE_TABLE_EXAMPLE }}
          NOTION_DATABASE_EXAMPLE: ${{ secrets.NOTION_DATABASE_EXAMPLE }}
          LOG_LEVEL: info
        run: npm run sync:notion

      - name: Report status
        if: always()
        run: echo "Sync completed with status ${{ job.status }}"
